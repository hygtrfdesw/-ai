<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6fb8c6" />
    <title>Lingyu Pocket AI</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=28" />
  </head>
  <body class="simple-mode">
    <div class="ambient-grid" aria-hidden="true"></div>
    <main class="app-shell">
      <section class="statusbar" aria-label="status">
        <span id="clock">12:36</span>
        <span class="status-icons">WiFi 5G 31%</span>
      </section>

      <section class="device-stage" aria-label="pocket ai">
        <div class="hand-glow"></div>
        <div class="stage-shadow" aria-hidden="true"></div>
        <div class="pocket-device">
          <div class="device-aura" aria-hidden="true"></div>
          <div class="device-screen">
            <div class="screen-glass" aria-hidden="true"></div>
            <div class="pixel-dust" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="scanline"></div>
            <div class="screen-top">
              <span class="signal">|||</span>
              <span class="battery">31%</span>
            </div>
            <video class="character-video" id="characterVideo" src="./assets/lingyu-character.mp4" autoplay muted loop playsinline></video>
            <div class="voice-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="subtitle" id="subtitle"></div>
            <button class="tiny-toggle" id="moodButton" aria-label="mood"></button>
          </div>
          <div class="device-led led-left" aria-hidden="true"></div>
          <div class="device-led led-right" aria-hidden="true"></div>
          <div class="speaker left"></div>
          <button class="home-key" id="homeKey" aria-label="wake"></button>
          <div class="speaker right"></div>
        </div>
      </section>

      <section class="simple-console" aria-label="chat">
        <button id="soundButton" class="hidden-control" type="button"></button>
        <button id="locateButton" class="hidden-control" type="button"></button>
        <button id="eyeButton" class="hidden-control" type="button"></button>
        <button id="listenButton" class="hidden-control" type="button"></button>
        <button id="voiceTestButton" class="hidden-control" type="button"></button>
        <form class="composer" id="composer">
          <input id="messageInput" autocomplete="off" />
          <button id="sendButton" type="submit"></button>
        </form>
        <div class="quiet-meta">
          <span id="systemState"></span>
          <span id="offlineState"></span>
        </div>
        <div class="backend-setup" id="backendSetup" hidden>
          <input id="apiBaseInput" inputmode="url" autocomplete="off" placeholder="后端地址，例如 http://192.168.80.153:4173" />
          <button id="apiBaseSave" type="button">连接</button>
        </div>
        <div class="hidden-helpers" aria-hidden="true">
          <select id="voiceSelect"></select>
          <div id="chatLog"></div>
          <div id="moodPill"></div>
          <div id="locationTitle"></div>
          <div id="locationDetail"></div>
          <button class="memory-card active" data-prompt=""></button>
          <button class="memory-card" data-prompt=""></button>
          <button class="memory-card" data-prompt=""></button>
        </div>
      </section>
    </main>
    <script src="./config.js?v=28"></script>
    <script src="./app.js?v=28"></script>
  </body>
</html>
